[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ajmwagar/mycelium"

[workspace.dependencies]
mycelium-core = { path = "crates/mycelium-core" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util"] }

[profile.release]
lto = "thin"

# Lease-only DHCP service for the isolated first-boot bridge.
# Genesis runs a separate ProxyDHCP/TFTP instance on the same bridge.
port=0
bind-dynamic
interface=genesis0
log-dhcp
dhcp-authoritative
dhcp-range=192.0.2.100,192.0.2.150,255.255.255.0,1h
dhcp-option=option:router
dhcp-option=option:dns-server

[Unit]
Requires=fungos-claim-envelope.service
After=fungos-claim-envelope.service
ConditionPathExists=
ConditionPathExists=/run/fungos-first-contact/first-contact.env

[Service]
StandardOutput=journal+console
StandardError=journal+console
ExecStart=
ExecStart=/usr/libexec/fungos-first-contact /run/fungos-first-contact/first-contact.env
Environment=HOME=/var/lib/fungos-home
Environment=MYCELIUM_HOME=/var/lib/mycelium
StateDirectory=fungos mycelium fungos-home
ReadWritePaths=/etc/systemd/system /var/lib/mycelium /var/lib/fungos-home /run/fungos-first-contact

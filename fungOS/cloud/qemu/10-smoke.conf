[Service]
# Isolated nested-QEMU smoke test: no NAT or host-published workload ports.
ExecStart=
ExecStart=/var/lib/mycelium/software/shroud/current/shroud --config-dir /etc/shroud/vms --runtime-dir /var/lib/shroud --snapshot-dir /var/lib/shroud/snapshots --firecracker-bin /var/lib/mycelium/software/firecracker/current/firecracker --kernel-image /var/lib/shroud/kernels/vmlinux --no-autostart --no-nat

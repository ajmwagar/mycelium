worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 256; }
# Agora's reviewed shared ingress. Change the names/address together for another
# host; the backend must be that host's own Mycelium viewer, never an HTTP proxy
# claiming the user's identity. Container port 8443 is published as LAN port 443.
stream {
    map $ssl_preread_server_name $tls_backend {
        agora-one.wagar-house.myc 192.168.2.67:8443;
        mycelium.agora-one.wagar-house.myc 192.168.2.67:8443;
        default 127.0.0.1:9443;
    }
    server {
        listen 8443;
        ssl_preread on;
        proxy_pass $tls_backend;
        proxy_connect_timeout 3s;
        proxy_timeout 300s;
    }
}
http {
    map $request_uri $content_path {
        "/" "";
        default $request_uri;
    }
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 127.0.0.1:9443 ssl default_server;
        ssl_certificate /tls/server.pem;
        ssl_certificate_key /tls/server-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        server_tokens off;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "sandbox; default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:;" always;
        # Canonical base32 CID label; Kubo validates the actual CID encoding.
        if ($host !~ "^([a-z2-7]{1,63})\.ipfs\.myc$") { return 404; }
        set $cid $1;
        location / {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            proxy_pass http://unibus-kubo-private:8080/ipfs/$cid$content_path;
            resolver 127.0.0.11 valid=30s;
            proxy_set_header Host 127.0.0.1:8080;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_hide_header Set-Cookie;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_buffering off;
        }
    }
}

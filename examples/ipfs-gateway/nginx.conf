worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8080;
        server_tokens off;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        # Dedicated content origin: scripts in arbitrary IPFS HTML are disabled.
        add_header Content-Security-Policy "sandbox; default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:;" always;
        location / { return 404; }
        location /ipfs/ {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            proxy_pass http://unibus-kubo-private:8080;
            proxy_set_header Host localhost;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_hide_header Set-Cookie;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_buffering off;
        }
    }
}
